name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.7.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, test, build
        run: pnpm exec nx run-many -t lint typecheck test build

      # Everything above passes against the working tree and the project
      # references, which is why it all went green while 2.0.0 shipped
      # @dashforge/ui-core and @dashforge/rbac with a declaration entry
      # point re-exporting from paths the tarball did not contain. This
      # step packs each package and checks what a consumer would install.
      - name: Verify what the tarballs actually ship
        run: node scripts/verify-tarballs.mjs
